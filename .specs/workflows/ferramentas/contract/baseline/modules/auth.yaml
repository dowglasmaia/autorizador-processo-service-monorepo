openapi: 3.1.0
info:
  title: Autorizador — módulo auth
  version: 1.0.0
  description: Login por e-mail e senha com JWT e consulta do usuário autenticado.
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Autenticação.
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      operationId: autenticar
      tags: [Auth]
      summary: Autentica com e-mail e senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '../common/responses.yaml#/components/responses/BadRequestResponse'
        '401':
          $ref: '../common/responses.yaml#/components/responses/UnauthorizedResponse'
        '429':
          $ref: '../common/responses.yaml#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '../common/responses.yaml#/components/responses/InternalServerErrorResponse'
  /auth/me:
    get:
      operationId: obterUsuarioAtual
      tags: [Auth]
      summary: Obtém o usuário autenticado
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '../common/responses.yaml#/components/responses/UnauthorizedResponse'
        '500':
          $ref: '../common/responses.yaml#/components/responses/InternalServerErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      $ref: '../common/security.yaml#/components/securitySchemes/bearerAuth'
  schemas:
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail do usuário (normalizado no servidor).
        senha:
          type: string
          minLength: 1
          maxLength: 128
          description: Senha em texto; nunca é registrada em log.
    Usuario:
      type: object
      required: [id, email]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiraEm, usuario]
      properties:
        accessToken:
          type: string
          description: JWT HS256.
        tokenType:
          type: string
          enum: [Bearer]
        expiraEm:
          type: integer
          format: int64
          description: Validade do token em segundos.
        usuario:
          $ref: '#/components/schemas/Usuario'
