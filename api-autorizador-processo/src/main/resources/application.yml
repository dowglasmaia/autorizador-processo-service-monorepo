spring:
  application:
    name: api-autorizador-processo
  profiles:
    default: local
  datasource:
    # Sem valor padrão fora do perfil local: o contêiner/ambiente precisa informar as três variáveis.
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      # Tabelas de auditoria do Envers seguem o sufixo da V2 (ADR-05).
      org.hibernate.envers.audit_table_suffix: _audit
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    # Lista separada por vírgula; vazio = nenhuma origem liberada. O curinga "*" é ignorado.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    # Sem valor padrão: ausente ou com menos de 32 bytes, a aplicação não inicia (ADR-16).
    secret: ${JWT_SECRET:}
    issuer: autorizador-processo
    ttl-minutos: ${JWT_TTL_MINUTOS:60}

  auth:
    bootstrap:
      # Primeiro usuário: criado só com a tabela vazia e as duas variáveis presentes. Sem valor padrão.
      email: ${AUTH_BOOTSTRAP_EMAIL:}
      senha: ${AUTH_BOOTSTRAP_SENHA:}

  http:
    # Limite do corpo (413 acima dele); o Nginx aplica o seu próprio (NGINX_MAX_BODY).
    max-body-bytes: ${HTTP_MAX_BODY_BYTES:65536}

server:
  port: ${SERVER_PORT:8080}
  # Limite do total de cabeçalhos da requisição (Tomcat responde 431 acima dele).
  max-http-request-header-size: ${HTTP_MAX_HEADER_BYTES:16KB}

management:
  # Só health e info são expostos; métricas Micrometer ficam internas (sem endpoint, sem coletor).
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Sem detalhes fora do perfil local (que sobrescreve para always).
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  # Tracing and metrics via Spring Boot's native OpenTelemetry support (Micrometer Tracing bridge + OTLP).
  # Export is OFF by default; set OTEL_EXPORT_ENABLED=true and the standard OTEL_EXPORTER_OTLP_* variables
  # (mapped automatically by Spring Boot) to send data to an OpenTelemetry Collector.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${APP_ENV:production}
# Structured JSON logs on stdout (Spring Boot native, Logback underneath). Formats: ecs, logstash, gelf.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${APP_ENV:production}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.maia.autorizador: ${LOG_LEVEL_APP:INFO}
