spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autorizador}
  flyway:
    # A seed de desenvolvimento só existe no perfil local (ADR-14).
    locations: classpath:db/migration,classpath:db/seed
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server:
  port: ${PORT:8080}
# Readable single-line logs for the terminal; every other profile emits JSON.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{traceId:-}] %logger{36} : %msg %kvp%n"
  structured:
    format:
      console: ""
  level:
    org.maia.autorizador: ${LOG_LEVEL_APP:DEBUG}
