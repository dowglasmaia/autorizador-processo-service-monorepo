spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autorizador}
    username: ${DB_USERNAME:autorizador}
  flyway:
    # A seed de desenvolvimento só existe no perfil local (ADR-14).
    locations: classpath:db/migration,classpath:db/seed
    # Bancos locais antigos recebem migrações novas mesmo com a seed (V1000) já aplicada; ver FlywayLocalConfig.
    out-of-order: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server:
  port: ${SERVER_PORT:8080}
# Readable single-line logs for the terminal; every other profile emits JSON.
management:
  endpoint:
    health:
      show-details: always
      show-components: always
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} : %msg %kvp%n"
  structured:
    format:
      console: ""
  level:
    org.maia.autorizador: ${LOG_LEVEL_APP:DEBUG}
