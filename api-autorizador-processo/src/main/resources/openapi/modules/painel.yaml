openapi: 3.1.0
info:
  title: Autorizador — módulo painel
  version: 1.0.0
  description: Resumo agregado para o painel.
servers:
  - url: /api/v1
tags:
  - name: Painel
    description: Indicadores do painel.
paths:
  /painel/resumo:
    get:
      operationId: obterResumoPainel
      tags: [Painel]
      summary: Obtém o resumo do painel
      responses:
        '200':
          description: Resumo do painel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoPainel'
        '500':
          $ref: '../common/responses.yaml#/components/responses/InternalServerErrorResponse'
components:
  schemas:
    CoberturaFaixa:
      type: object
      required: [faixa, quantidade]
      properties:
        faixa:
          $ref: 'procedimento.yaml#/components/schemas/FaixaEtaria'
        quantidade:
          type: integer
          format: int32
          description: Número de procedimentos que aceitam a faixa etária.
    DistribuicaoSexos:
      type: object
      required: [masculino, feminino]
      properties:
        masculino:
          type: integer
          format: int32
          description: Procedimentos que aceitam o sexo masculino.
        feminino:
          type: integer
          format: int32
          description: Procedimentos que aceitam o sexo feminino.
    ResumoPainel:
      type: object
      required: [totalProcedimentos, totalAutorizacoes, faixasCobertas, coberturaPorFaixa, distribuicaoSexos, ultimasAutorizacoes]
      properties:
        totalProcedimentos:
          type: integer
          format: int32
        totalAutorizacoes:
          type: integer
          format: int32
        faixasCobertas:
          type: integer
          format: int32
        coberturaPorFaixa:
          type: array
          description: Só as faixas com ao menos um procedimento, da mais nova para a mais velha.
          items:
            $ref: '#/components/schemas/CoberturaFaixa'
        distribuicaoSexos:
          $ref: '#/components/schemas/DistribuicaoSexos'
        ultimasAutorizacoes:
          type: array
          maxItems: 4
          description: Até 4 autorizações mais recentes.
          items:
            $ref: 'autorizacao.yaml#/components/schemas/Autorizacao'
