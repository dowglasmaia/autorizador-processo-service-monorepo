openapi: 3.1.0
info:
  title: Autorizador — módulo autorizacao
  version: 1.0.0
  description: Solicitação e consulta de autorizações de procedimentos por sexo e idade.
servers:
  - url: /api/v1
tags:
  - name: Autorizacoes
    description: Solicitações de autorização.
paths:
  /autorizacoes:
    post:
      operationId: solicitarAutorizacao
      tags: [Autorizacoes]
      summary: Solicita a autorização de um procedimento
      description: Registra a solicitação quando sexo e idade são aderentes ao procedimento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutorizacaoRequest'
      responses:
        '201':
          description: Autorização concedida e registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Autorizacao'
        '400':
          $ref: '../common/responses.yaml#/components/responses/BadRequestResponse'
        '403':
          $ref: '../common/responses.yaml#/components/responses/ForbiddenResponse'
        '404':
          $ref: '../common/responses.yaml#/components/responses/NotFoundResponse'
        '500':
          $ref: '../common/responses.yaml#/components/responses/InternalServerErrorResponse'
    get:
      operationId: listarAutorizacoes
      tags: [Autorizacoes]
      summary: Lista autorizações paginadas, das mais recentes para as mais antigas
      parameters:
        - name: page
          in: query
          required: false
          description: Número da página, começando em 0.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Itens por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Página de autorizações.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAutorizacoes'
        '400':
          $ref: '../common/responses.yaml#/components/responses/BadRequestResponse'
        '500':
          $ref: '../common/responses.yaml#/components/responses/InternalServerErrorResponse'
components:
  schemas:
    AutorizacaoRequest:
      type: object
      required: [numProcedimento, idade, sexo]
      properties:
        numProcedimento:
          type: integer
          format: int32
          minimum: 1
          description: Número do procedimento.
        idade:
          type: integer
          format: int32
          minimum: 0
          maximum: 150
          description: Idade do beneficiário.
        sexo:
          type: string
          pattern: '^[MFmf]$'
          description: Sexo do beneficiário (M ou F, aceita minúsculas).
    Autorizacao:
      type: object
      required: [id, procedimento, permitido, criadaEm]
      properties:
        id:
          type: integer
          format: int64
        procedimento:
          $ref: 'procedimento.yaml#/components/schemas/Procedimento'
        permitido:
          type: boolean
          description: Resultado da autorização.
        criadaEm:
          type: [string, 'null']
          format: date-time
          description: Data de criação em UTC; pode ser nula.
    PaginaAutorizacoes:
      type: object
      required: [itens, pagina, tamanho, totalItens, totalPaginas]
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/Autorizacao'
        pagina:
          type: integer
          format: int32
        tamanho:
          type: integer
          format: int32
        totalItens:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int32
