# Ambiente local em contêineres: PostgreSQL + API + frontend (Nginx).
# Só o banco:   docker compose up -d postgres            (para rodar a API/front na máquina, fora do Docker)
# Banco + API:  docker compose up -d --build postgres api  (exige JWT_SECRET no .env; API em http://localhost:8080)
# Tudo:         docker compose up -d --build              (exige JWT_SECRET no .env; front em http://localhost:4200, com proxy /api/ para a API)
# Parar:        docker compose down                       (acrescente -v para apagar também o volume do banco)
# Variáveis:    copie .env.example para .env e ajuste (valores do exemplo são SOMENTE de desenvolvimento).
# Testes de integração NÃO dependem deste arquivo (usam Testcontainers).
name: autorizador-processo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autorizador}
      POSTGRES_USER: ${POSTGRES_USER:-autorizador}
      # Valor padrão apenas para desenvolvimento local; defina POSTGRES_PASSWORD no .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autorizador}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api-autorizador-processo
    environment:
      # Dentro da rede do compose o banco é o serviço `postgres` (não localhost).
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-autorizador}
      DB_USERNAME: ${POSTGRES_USER:-autorizador}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-autorizador}
      APP_ENV: ${APP_ENV:-local-docker}
      # Padrão `local` (seed, Swagger e detalhes de health, usados pelo e2e). Fora da máquina local use `prod`.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      # Obrigatório (mínimo 32 bytes): sem ele o compose recusa subir.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_TTL_MINUTOS: ${JWT_TTL_MINUTOS:-60}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_SENHA: ${AUTH_BOOTSTRAP_SENHA:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Limites de requisição (SPEC-41): corpo (413) e total de cabeçalhos.
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-65536}
      HTTP_MAX_HEADER_BYTES: ${HTTP_MAX_HEADER_BYTES:-16384}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # Readiness inclui o banco (etapa 12); curl é instalado na imagem de runtime.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ./app-autorizador-processo
    environment:
      # Limites do Nginx (SPEC-41): corpo, buffer de cabeçalho e login por IP.
      NGINX_MAX_BODY: ${NGINX_MAX_BODY:-64k}
      NGINX_MAX_HEADER_BUFFER: ${NGINX_MAX_HEADER_BUFFER:-8k}
      NGINX_LOGIN_RATE: ${NGINX_LOGIN_RATE:-30r/m}
      NGINX_LOGIN_BURST: ${NGINX_LOGIN_BURST:-10}
    ports:
      # O Nginx sem privilégios escuta em 8080 dentro do contêiner.
      - "${APP_PORT:-4200}:8080"
    healthcheck:
      # 127.0.0.1 (e não localhost): em Alpine localhost resolve primeiro para ::1 e o Nginx escuta só em IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
